[package]
name = "tracescope-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic trace simulation and explicit generational arena lifecycle"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.129"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
